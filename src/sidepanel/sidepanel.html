<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>web-python-editor</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <!--
    要素は縦に積む（基本設計 §5 / ADR 0006）。
    data-state は実行状態を表し、main.js の setState が書き換える。ステータスの
    印の色とボタンの見え方は、この 1 つの属性から CSS が決める（ADR 0010）。
  -->
  <body data-state="initializing">
    <header class="toolbar">
      <div class="status">
        <span class="status-dot" id="status-dot"></span>
        <span class="status-label" id="status-label">Pyodide を初期化中…</span>
      </div>
      <div class="actions">
        <button type="button" class="button button--primary" id="run-button" disabled>実行</button>
        <button type="button" class="button button--danger" id="stop-button" disabled>停止</button>
      </div>
    </header>

    <!-- CodeMirror 6 の取り付け先。中身は editor.js が作る -->
    <main class="editor" id="editor"></main>

    <section class="output">
      <div class="output-header">
        <h2 class="output-title">出力</h2>
        <button type="button" class="output-clear" id="clear-button">クリア</button>
      </div>
      <!--
        出力領域は追記専用。入力待ちの間だけ、末尾行の中に置いた span を
        contenteditable="plaintext-only" にする（ADR 0012 / main.md）。
        領域そのものを編集可能にはしない。
      -->
      <div class="output-body" id="output"></div>
    </section>

    <script type="module" src="main.js"></script>
  </body>
</html>
